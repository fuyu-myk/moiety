[package]
name = "moiety-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
moiety = { path = "../crates/moiety" }
moiety-draw = { path = "../crates/moiety-draw" }

[[bin]]
name = "playground"
path = "fuzz_targets/playground.rs"
test = false
doc = false
bench = false

# Kept out of the main workspace: fuzzing needs a nightly toolchain.
[workspace]
members = ["."]
