# moiety conformance suite.
#
# Each case names an input and the interpretation every conforming
# implementation must return for it. Fields:
#
#   id       unique identifier, grouped by topic
#   corpus   "curated" or "adversarial"
#   input    the formula, exactly as a user would type it
#   expect   "unique", "ambiguous", "underdetermined" or "invalid"
#   smiles   expected readings in rank order, any valid SMILES spelling
#   classes  expected ambiguity classes (ambiguous cases)
#   reason   expected underdetermination reason
#   code     expected diagnostic code (invalid cases)
#   span     expected primary span as [start, end) byte offsets in the input
#   warnings expected warning codes, in any order

[suite]
name = "moiety-conformance"
version = "0.3.0"
grammar = 2
ranking = 2

# Chains and branches

[[case]]
id = "chain/ethanol"
corpus = "curated"
input = "CH3CH2OH"
expect = "unique"
smiles = ["CCO"]

[[case]]
id = "chain/hexane-repeat"
corpus = "curated"
input = "CH3(CH2)4CH3"
expect = "unique"
smiles = ["CCCCCC"]

[[case]]
id = "chain/ethylene-glycol"
corpus = "curated"
input = "HOCH2CH2OH"
expect = "unique"
smiles = ["OCCO"]

[[case]]
id = "branch/isobutyric-acid"
corpus = "curated"
input = "(CH3)2CHCOOH"
expect = "unique"
smiles = ["CC(C)C(=O)O"]

[[case]]
id = "branch/isopentanol"
corpus = "curated"
input = "CH3CH(CH3)CH2CH2OH"
expect = "unique"
smiles = ["CC(C)CCO"]

[[case]]
id = "branch/tert-butanol"
corpus = "curated"
