# Verdicts on every disagreement between moiety and MolScribe in report.toml.
#
# verdict = "moiety": moiety's result is right.
# verdict = "both": both results are defensible readings of the label.
# verdict = "other": MolScribe is right, so moiety has a bug to fix.

[[adjudication]]
text = "C3H7"
side = "left"
verdict = "moiety"
note = "Propyl and isopropyl share this formula; moiety reports it as underdetermined instead of guessing n-propyl."

[[adjudication]]
text = "C4H9"
side = "left"
verdict = "moiety"
note = "Four butyl isomers share this formula; moiety reports it as underdetermined instead of guessing n-butyl."

[[adjudication]]
text = "sBu"
side = "left"
verdict = "moiety"
note = "sec-Butyl. MolScribe has no sBu entry and reads the label as n-butyl."

