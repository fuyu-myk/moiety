# Default moiety abbreviation dictionary.
#
# Each entry defines a fragment in SMILES, where every `*` is an attachment
# point. `spellings` are read with the attachment on the left, as in `COOH`;
# `reversed` with the attachment on the right, as in `HOOC`.

[dictionary]
name = "moiety-default"
version = "1.4.0"

# Alkyl

[[entry]]
name = "methyl"
smiles = "*C"
spellings = ["Me"]

[[entry]]
name = "ethyl"
smiles = "*CC"
spellings = ["Et", "C2H5"]

[[entry]]
name = "vinyl"
smiles = "*C=C"
spellings = ["C2H3"]

[[entry]]
name = "n-propyl"
smiles = "*CCC"
spellings = ["Pr", "nPr", "n-Pr", "n-C3H7"]

[[entry]]
name = "isopropyl"
smiles = "*C(C)C"
spellings = ["iPr", "i-Pr", "i-C3H7"]

[[entry]]
name = "cyclopropyl"
smiles = "*C1CC1"
spellings = ["cPr", "c-Pr"]

[[entry]]
name = "n-butyl"
smiles = "*CCCC"
spellings = ["Bu", "nBu", "n-Bu", "n-C4H9"]

[[entry]]
name = "isobutyl"
smiles = "*CC(C)C"
spellings = ["iBu", "i-Bu"]

[[entry]]
name = "sec-butyl"
smiles = "*C(C)CC"
spellings = ["sBu", "s-Bu", "sec-Bu"]

[[entry]]
name = "tert-butyl"
smiles = "*C(C)(C)C"
spellings = ["tBu", "t-Bu", "tert-Bu", "t-C4H9"]

[[entry]]
name = "pentafluoroethyl"
smiles = "*C(F)(F)C(F)(F)F"
spellings = ["C2F5"]

[[entry]]
name = "cyclohexyl"
smiles = "*C1CCCCC1"
spellings = ["Cy", "C6H11"]

[[entry]]
name = "1-adamantyl"
smiles = "*C12CC3CC(CC(C3)C1)C2"
spellings = ["Ad", "1-Ad"]

[[entry]]
name = "2-adamantyl"
smiles = "*C1C2CC3CC(C2)CC1C3"
spellings = ["2-Ad"]

# Aryl and arylalkyl

[[entry]]
name = "benzene"
smiles = "c1ccccc1"
spellings = ["C6H6"]

[[entry]]
name = "phenyl"
smiles = "*c1ccccc1"
spellings = ["Ph", "C6H5"]

[[entry]]
name = "p-tolyl"
smiles = "*c1ccc(C)cc1"
spellings = ["Tol", "p-Tol"]

[[entry]]
name = "mesityl"
smiles = "*c1c(C)cc(C)cc1C"
spellings = ["Mes"]

[[entry]]
name = "2,6-diisopropylphenyl"
smiles = "*c1c(C(C)C)cccc1C(C)C"
spellings = ["Dipp"]

[[entry]]
name = "4-methoxyphenyl"
smiles = "*c1ccc(OC)cc1"
spellings = ["PMP"]

[[entry]]
name = "pentafluorophenyl"
smiles = "*c1c(F)c(F)c(F)c(F)c1F"
spellings = ["C6F5"]

# Heteroaryl and naphthyl, attached at the position their locant names

[[entry]]
name = "2-pyridyl"
smiles = "*c1ccccn1"
spellings = ["2-C5H4N", "2-Py"]

[[entry]]
name = "3-pyridyl"
smiles = "*c1cccnc1"
spellings = ["3-C5H4N", "3-Py"]

[[entry]]
name = "4-pyridyl"
smiles = "*c1ccncc1"
spellings = ["4-C5H4N", "4-Py"]

[[entry]]
name = "2-thienyl"
smiles = "*c1cccs1"
spellings = ["2-C4H3S"]

[[entry]]
name = "3-thienyl"
smiles = "*c1ccsc1"
spellings = ["3-C4H3S"]

[[entry]]
name = "2-furyl"
smiles = "*c1ccco1"
spellings = ["2-C4H3O"]

[[entry]]
name = "3-furyl"
smiles = "*c1ccoc1"
spellings = ["3-C4H3O"]

[[entry]]
name = "1-naphthyl"
smiles = "*c1cccc2ccccc12"
spellings = ["1-C10H7", "1-Naph"]

[[entry]]
name = "2-naphthyl"
smiles = "*c1ccc2ccccc2c1"
spellings = ["2-C10H7", "2-Naph"]

[[entry]]
name = "benzyl"
smiles = "*Cc1ccccc1"
spellings = ["Bn"]

[[entry]]
name = "p-methoxybenzyl"
smiles = "*Cc1ccc(OC)cc1"
spellings = ["PMB"]

[[entry]]
name = "trityl"
smiles = "*C(c1ccccc1)(c1ccccc1)c1ccccc1"
spellings = ["Tr", "Trt"]

# Acyl and sulfonyl

[[entry]]
name = "acetyl"
smiles = "*C(C)=O"
spellings = ["Ac"]

[[entry]]
name = "benzoyl"
smiles = "*C(=O)c1ccccc1"
spellings = ["Bz"]

[[entry]]
name = "pivaloyl"
smiles = "*C(=O)C(C)(C)C"
spellings = ["Piv"]

[[entry]]
name = "tosyl"
smiles = "*S(=O)(=O)c1ccc(C)cc1"
spellings = ["Ts"]

[[entry]]
name = "mesyl"
smiles = "*S(C)(=O)=O"
spellings = ["Ms"]

[[entry]]
name = "triflyl"
smiles = "*S(=O)(=O)C(F)(F)F"
spellings = ["Tf"]

# Protecting groups

[[entry]]
name = "tert-butoxycarbonyl"
smiles = "*C(=O)OC(C)(C)C"
spellings = ["Boc", "CO2tBu", "CO2t-Bu"]
reversed = ["tBuO2C", "t-BuO2C"]

[[entry]]
name = "benzyloxycarbonyl"
smiles = "*C(=O)OCc1ccccc1"
spellings = ["Cbz"]

[[entry]]
name = "fluorenylmethoxycarbonyl"
smiles = "*C(=O)OCC1c2ccccc2-c2ccccc12"
spellings = ["Fmoc"]

[[entry]]
name = "allyloxycarbonyl"
smiles = "*C(=O)OCC=C"
spellings = ["Alloc"]

[[entry]]
name = "2,2,2-trichloroethoxycarbonyl"
smiles = "*C(=O)OCC(Cl)(Cl)Cl"
spellings = ["Troc"]

[[entry]]
name = "2-(trimethylsilyl)ethoxycarbonyl"
smiles = "*C(=O)OCC[Si](C)(C)C"
spellings = ["Teoc"]

[[entry]]
name = "methoxymethyl"
smiles = "*COC"
spellings = ["MOM"]

[[entry]]
name = "tetrahydropyranyl"
smiles = "*C1CCCCO1"
spellings = ["THP"]

[[entry]]
name = "trimethylsilyl"
smiles = "*[Si](C)(C)C"
spellings = ["TMS"]

[[entry]]
name = "triethylsilyl"
smiles = "*[Si](CC)(CC)CC"
spellings = ["TES"]

[[entry]]
name = "tert-butyldimethylsilyl"
smiles = "*[Si](C)(C)C(C)(C)C"
spellings = ["TBS", "TBDMS"]

[[entry]]
name = "triisopropylsilyl"
smiles = "*[Si](C(C)C)(C(C)C)C(C)C"
spellings = ["TIPS"]

[[entry]]
name = "tert-butyldiphenylsilyl"
smiles = "*[Si](c1ccccc1)(c1ccccc1)C(C)(C)C"
spellings = ["TBDPS"]

[[entry]]
name = "2-(trimethylsilyl)ethoxymethyl"
smiles = "*COCC[Si](C)(C)C"
spellings = ["SEM"]

[[entry]]
name = "2-methoxyethoxymethyl"
smiles = "*COCCOC"
spellings = ["MEM"]

# Heteroatom-linked groups

[[entry]]
name = "methoxy"
smiles = "*OC"
spellings = ["OMe"]
