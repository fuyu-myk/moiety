[[entry]]
name = "ethoxy"
smiles = "*OCC"
spellings = ["OEt"]
reversed = ["EtO"]

[[entry]]
name = "tert-butoxy"
smiles = "*OC(C)(C)C"
spellings = ["OtBu", "Ot-Bu"]
reversed = ["tBuO", "t-BuO"]

[[entry]]
name = "phenoxy"
smiles = "*Oc1ccccc1"
spellings = ["OPh"]
reversed = ["PhO"]

[[entry]]
name = "benzyloxy"
smiles = "*OCc1ccccc1"
spellings = ["OBn"]
reversed = ["BnO"]

[[entry]]
name = "acetoxy"
smiles = "*OC(C)=O"
spellings = ["OAc"]
reversed = ["AcO"]

[[entry]]
name = "tosyloxy"
smiles = "*OS(=O)(=O)c1ccc(C)cc1"
